<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="description" content="What to wear for a road bike ride, based on min/max temperature and sun.">
  <title>Bike Outfit Selector</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/logic.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>Bike Outfit Selector</h1>
  </header>

  <main class="container stack">
    <form id="ride-form" class="card form-stack" novalidate>
      <div class="row-2">
        <label class="field">
          <span class="field-label">T min (°C)</span>
          <input id="t-min" type="number" inputmode="decimal" step="0.5" placeholder="e.g. 8" required>
        </label>
        <label class="field">
          <span class="field-label">T max (°C)</span>
          <input id="t-max" type="number" inputmode="decimal" step="0.5" placeholder="e.g. 15" required>
        </label>
      </div>
      <div class="row-between">
        <label class="switch">
          <input id="sunny" type="checkbox">
          <span class="slider" aria-hidden="true"></span>
          <span>Sunny</span>
        </label>
        <button class="btn primary" type="submit">Calculate</button>
      </div>
    </form>

    <div id="results" class="stack" aria-live="polite"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>
</body>
</html>
